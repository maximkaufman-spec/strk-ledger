<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#020207">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Quanta STRK">
  <title>Quanta · Starknet Portfolio</title>
  <style>
    :root{color-scheme:dark;--orange:#ff9700;--violet:#7410d8;--ink:#020207;--muted:#a9a8b2;--panel:rgba(255,255,255,.055)}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--ink);overscroll-behavior:none}
    body{position:fixed;inset:0;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}
    .app{position:relative;width:100%;height:100vh;height:100dvh;min-height:560px;overflow:hidden;padding:max(18px,env(safe-area-inset-top)) 22px max(16px,env(safe-area-inset-bottom));display:flex;flex-direction:column;isolation:isolate;background:radial-gradient(circle at 50% 69%,rgba(87,0,151,.16),transparent 35%),#020207}
    .stars,.stars:before,.stars:after{position:absolute;inset:0;content:"";z-index:-3;pointer-events:none;background-image:radial-gradient(circle,#fff 0 1px,transparent 1.6px),radial-gradient(circle,#8739d4 0 1px,transparent 1.7px);background-size:73px 81px,121px 137px;background-position:9px 17px,34px 65px;opacity:.24}
    .stars:before{transform:translate(31px,23px) scale(.72);opacity:.28}.stars:after{transform:translate(-18px,47px) scale(.5);opacity:.2}
    header{display:flex;align-items:center;justify-content:space-between;min-height:44px;flex:0 0 auto}
    .brand{font-size:19px;font-weight:750;letter-spacing:-.5px}.brand span{color:var(--orange);font-weight:650}
    .ledger{display:flex;align-items:center;gap:7px;padding:8px 11px;border:1px solid rgba(255,255,255,.1);border-radius:999px;background:rgba(255,255,255,.055);font-size:12px;color:#d7d6df;backdrop-filter:blur(10px)}
    .dot{width:7px;height:7px;border-radius:50%;background:#39d98a;box-shadow:0 0 9px #39d98a}
    main{position:relative;z-index:1;display:flex;flex:1;min-height:0;flex-direction:column;align-items:center;text-align:center;padding-top:clamp(12px,3.2dvh,34px)}
    .eyebrow{margin:0;color:#d4d2dc;font-size:clamp(15px,4vw,20px);font-weight:300;letter-spacing:.22em;text-transform:uppercase}
    h1{margin:8px 0 0;font-size:clamp(42px,12.2vw,66px);line-height:.9;letter-spacing:-.065em;text-transform:uppercase;background:linear-gradient(180deg,#ffb100 0%,#ff8a00 55%,#c84f00 100%);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 10px 32px rgba(255,113,0,.12)}
    .currency{font-size:.5em;letter-spacing:-.03em;margin-left:.08em}.token-balance{height:24px;margin-top:12px;color:#d0ced8;font-size:15px;font-variant-numeric:tabular-nums}
    .metrics{width:min(100%,430px);display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:15px}
    .metric{min-width:0;padding:11px 7px 10px;border:1px solid rgba(255,255,255,.075);border-radius:16px;background:var(--panel);backdrop-filter:blur(12px)}
    .metric-label{font-size:10px;color:#92909c;letter-spacing:.03em;margin-bottom:6px}.metric-value{min-height:19px;font-size:14px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.positive{color:#51dc97}.negative{color:#ff6577}
    .globe-wrap{position:relative;flex:1;width:min(92vw,470px);min-height:170px;margin-top:9px;display:flex;align-items:center;justify-content:center}.glow{position:absolute;width:78%;aspect-ratio:1;border-radius:50%;background:rgba(107,0,206,.27);filter:blur(42px)}
    .globe{position:relative;width:min(61vw,300px);aspect-ratio:1;border-radius:50%;overflow:hidden;border:1px solid rgba(194,92,255,.38);box-shadow:inset -32px -20px 55px #07000d,inset 18px 11px 35px rgba(179,65,255,.28),0 0 34px rgba(119,0,202,.23);background:radial-gradient(circle at 36% 28%,#6410a0 0 4%,#330050 33%,#11001d 67%,#030007 100%)}
    .globe:before{content:"";position:absolute;inset:9% 8%;border-radius:46% 54% 48% 52%;background:radial-gradient(ellipse at 34% 20%,transparent 0 11%,rgba(204,111,255,.62) 12% 14%,transparent 15%),radial-gradient(ellipse at 68% 31%,rgba(112,21,161,.72) 0 14%,transparent 15%),radial-gradient(ellipse at 28% 55%,rgba(130,29,178,.82) 0 18%,transparent 19%),radial-gradient(ellipse at 71% 68%,rgba(91,12,142,.85) 0 22%,transparent 23%);filter:contrast(1.25)}
    .globe:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 19%,rgba(209,127,255,.13) 20%,transparent 21%),repeating-linear-gradient(0deg,transparent 0 19%,rgba(209,127,255,.10) 20%,transparent 21%);border-radius:50%;transform:perspective(320px) rotate(-12deg) scale(1.04)}
    footer{flex:0 0 auto;width:min(100%,430px);margin:0 auto;display:flex;align-items:center;gap:10px}.address{min-width:0;flex:1;padding:11px 13px;border:1px solid rgba(255,255,255,.075);border-radius:14px;background:rgba(255,255,255,.045);color:#888692;font:10px ui-monospace,SFMono-Regular,Menlo,monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    button{flex:0 0 43px;width:43px;height:43px;border:0;border-radius:14px;background:linear-gradient(145deg,#ffb400,#ff8100);color:#0a0805;font-size:20px;font-weight:800;cursor:pointer}.status{height:17px;margin-top:7px;text-align:center;color:#777580;font-size:10px;font-variant-numeric:tabular-nums}
    @media(max-height:700px){.app{padding-top:max(10px,env(safe-area-inset-top));padding-bottom:max(9px,env(safe-area-inset-bottom))}main{padding-top:5px}.eyebrow{font-size:13px}h1{font-size:39px}.token-balance{margin-top:7px}.metrics{margin-top:8px}.metric{padding:8px 5px}.globe-wrap{margin-top:2px}.globe{width:min(42vh,235px)}}
  </style>
</head>
<body>
  <div class="app"><div class="stars"></div>
    <header><div class="brand">QUANTA <span>Technology</span></div><div class="ledger"><span class="dot"></span>Ledger Nano X</div></header>
    <main>
      <p class="eyebrow">Starknet portfolio</p>
      <h1><span id="portfolio">—</span><span class="currency">USD</span></h1>
      <div class="token-balance"><span id="balance">—</span> STRK</div>
      <section class="metrics">
        <div class="metric"><div class="metric-label">Цена STRK</div><div class="metric-value" id="price">$—</div></div>
        <div class="metric"><div class="metric-label">Изменение 24ч</div><div class="metric-value" id="change">—</div></div>
        <div class="metric"><div class="metric-label">Обновлено</div><div class="metric-value" id="updated">—</div></div>
      </section>
      <div class="globe-wrap" aria-hidden="true"><div class="glow"></div><div class="globe"></div></div>
    </main>
    <footer><div class="address">0x03c1ab4934be14ebf6125da485fe1c39a0ab8f85f0d3ca74097eae841182b9ab</div><button type="button" id="refreshButton" aria-label="Обновить">↻</button></footer>
    <div class="status" id="status">Только просмотр · автообновление каждые 4 секунды</div>
  </div>
  <script>
    const ADDRESS="0x03c1ab4934be14ebf6125da485fe1c39a0ab8f85f0d3ca74097eae841182b9ab";
    const TOKEN="0x04718f5a0fc34cc1af16a1cdee98ffb20c31f5cd61d6ab07201858f4287c938d";
    const SELECTOR="0x2e4263afad30923c891518314c3c95dbe830a16874e8abc5777a9a20b54c76e";
    const $=id=>document.getElementById(id);let refreshing=false;
    async function json(url,options={}){const response=await fetch(url,{...options,cache:"no-store"});if(!response.ok)throw Error("HTTP "+response.status);return response.json()}
    async function getBalance(){
      const endpoints=["https://starknet-rpc.publicnode.com","https://starknet-mainnet.public.blastapi.io/rpc/v0_8"];
      const body=JSON.stringify({jsonrpc:"2.0",id:1,method:"starknet_call",params:[{contract_address:TOKEN,entry_point_selector:SELECTOR,calldata:[ADDRESS]},"latest"]});
      for(const endpoint of endpoints){try{const data=await json(endpoint,{method:"POST",headers:{"Content-Type":"application/json"},body});if(data.result?.length){const raw=BigInt(data.result[0])+(BigInt(data.result[1]||"0x0")<<128n);return Number(raw)/1e18}}catch(error){console.warn(endpoint,error)}}throw Error("RPC unavailable")
    }
    async function getMarket(){const data=await json("https://starknet.impulse.avnu.fi/v3/tokens/"+TOKEN);const market=data.global||data.starknet||{};const price=market.usd;const change=market.usdMarketCapChangePercentage24h??market.usdPriceChangePercentage24h??0;if(price==null)throw Error("No price");return{price:Number(price),change:Number(change)}}
    async function refreshAll(){
      if(refreshing)return;refreshing=true;$("status").textContent="Обновление данных…";
      try{const[amount,market]=await Promise.all([getBalance(),getMarket()]);$("balance").textContent=amount.toLocaleString("ru-RU",{maximumFractionDigits:6});$("portfolio").textContent=(amount*market.price).toLocaleString("en-US",{maximumFractionDigits:0});$("price").textContent="$"+market.price.toLocaleString("en-US",{minimumFractionDigits:3,maximumFractionDigits:6});const change=$("change");change.textContent=(market.change>=0?"+":"")+market.change.toFixed(2)+"%";change.className="metric-value "+(market.change>=0?"positive":"negative");$("updated").textContent=new Date().toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit",second:"2-digit"});$("status").textContent="Только просмотр · автообновление каждые 4 секунды"}
      catch(error){console.error(error);$("status").textContent="Не удалось обновить данные · повтор через 4 секунды"}finally{refreshing=false}
    }
    $("refreshButton").addEventListener("click",refreshAll);refreshAll();setInterval(refreshAll,4000);
  </script>
</body>
</html>
