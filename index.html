<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0b0c"><title>Ledger Starknet</title>
<style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#0b0b0c;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:flex;align-items:center;justify-content:center;padding:22px}.card{width:min(430px,100%);background:#151517;border:1px solid #303034;border-radius:28px;padding:26px}.top{display:flex;justify-content:space-between;align-items:center}.badge{font-size:14px;background:#27272b;padding:8px 11px;border-radius:999px}h1{font-size:25px;margin:22px 0 5px}.muted{color:#9999a2}.balance{font-size:clamp(34px,10vw,44px);font-weight:750;margin-top:27px}.usd{font-size:27px;margin-top:5px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:25px}.box{background:#1e1e21;border-radius:18px;padding:16px}.label{font-size:13px;color:#9999a2;margin-bottom:7px}.value{font-size:18px;font-weight:650}.addr{margin-top:20px;padding:13px;border-radius:14px;background:#101012;font:11px ui-monospace,monospace;color:#aaaab3;overflow-wrap:anywhere}button{width:100%;margin-top:18px;padding:15px;border:0;border-radius:16px;font-size:17px;font-weight:700}.status{margin-top:13px;text-align:center;font-size:12px;color:#8c8c95;line-height:1.4}@media(max-width:430px){.balance{line-height:1.08}} </style></head><body><div class="card"><div class="top"><div class="badge">🔐 Ledger Nano X</div><div class="muted" id="updated">—</div></div><h1>Starknet Portfolio</h1><div class="muted">STRK · Starknet Mainnet</div><div class="balance"><span id="balance">—</span> STRK</div><div class="usd" id="portfolio">$—</div><div class="grid"><div class="box"><div class="label">Цена STRK</div><div class="value" id="price">$—</div></div><div class="box"><div class="label">Изменение 24ч</div><div class="value" id="change">—</div></div></div><div class="addr">0x03c1ab4934be14ebf6125da485fe1c39a0ab8f85f0d3ca74097eae841182b9ab</div><button onclick="refreshAll()">Обновить</button><div class="status" id="status">Только просмотр · приватные ключи не используются</div></div>
<script>
const ADDRESS="0x03c1ab4934be14ebf6125da485fe1c39a0ab8f85f0d3ca74097eae841182b9ab",TOKEN="0x04718f5a0fc34cc1af16a1cdee98ffb20c31f5cd61d6ab07201858f4287c938d",SELECTOR="0x2e4263afad30923c891518314c3c95dbe830a16874e8abc5777a9a20b54c76e";
async function json(url,o={}){let r=await fetch(url,o);if(!r.ok)throw Error("HTTP "+r.status);return r.json()}
async function getBalance(){
 const endpoints=["https://starknet-rpc.publicnode.com","https://starknet-mainnet.public.blastapi.io/rpc/v0_8"];
 const body=JSON.stringify({jsonrpc:"2.0",id:1,method:"starknet_call",params:[{contract_address:TOKEN,entry_point_selector:SELECTOR,calldata:[ADDRESS]},"latest"]});
 for(const ep of endpoints){try{const j=await json(ep,{method:"POST",headers:{"Content-Type":"application/json"},body});if(j.result?.length){const raw=BigInt(j.result[0])+(BigInt(j.result[1]||"0x0")<<128n);return Number(raw)/1e18}}catch(e){console.warn(ep,e)}}
 throw Error("RPC unavailable")
}
async function getMarket(){
 const j=await json("https://starknet.impulse.avnu.fi/v3/tokens/"+TOKEN);
 const p=j.global?.usd??j.starknet?.usd;
 const ch=j.global?.usdMarketCapChangePercentage24h??j.starknet?.usdPriceChangePercentage24h;
 if(p==null)throw Error("No price");return{price:Number(p),change:Number(ch??0)}
}
async function refreshAll(){
 status.textContent="Обновление…";
 try{const [b,m]=await Promise.all([getBalance(),getMarket()]);balance.textContent=b.toLocaleString("ru-RU",{maximumFractionDigits:6});price.textContent="$"+m.price.toLocaleString("en-US",{maximumFractionDigits:6});portfolio.textContent=(b*m.price).toLocaleString("en-US",{style:"currency",currency:"USD",maximumFractionDigits:2});change.textContent=(m.change>=0?"+":"")+m.change.toFixed(2)+"%";updated.textContent=new Date().toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"});status.textContent="Только просмотр · автообновление каждые 10 секунд"}
 catch(e){console.error(e);status.textContent="Ошибка получения данных: "+e.message}
}
refreshAll();setInterval(refreshAll,10000);
</script></body></html>
